      // Robust fix for chrome extensions or environments setting window.fetch
      (function() {
        try {
          var _fetch = window.fetch;
          function defineSafeFetch(target) {
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() { return _fetch; },
                set: function(fn) { _fetch = fn; },
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          }
          if (typeof Window !== 'undefined' && Window.prototype) {
            defineSafeFetch(Window.prototype);
          }
          defineSafeFetch(window);

          // Guard against getter-only redefinitions of fetch
          var origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if ((obj === window || (typeof Window !== 'undefined' && obj === Window.prototype)) && prop === 'fetch') {
              if (descriptor && descriptor.get && !descriptor.set) {
                var getter = descriptor.get;
                var setVal = null;
                descriptor.set = function(fn) { setVal = fn; };
                var originalGet = descriptor.get;
                descriptor.get = function() {
                  return setVal !== null ? setVal : originalGet.call(this);
                };
              }
            }
            return origDefineProperty.call(Object, obj, prop, descriptor);
          };

          // Suppress errors originating from browser extensions
          window.addEventListener('error', function(e) {
            if (e.filename && e.filename.indexOf('chrome-extension://') !== -1) {
              e.preventDefault();
            }
          });
        } catch (e) {}
      })();
    </script>
